packages:
    - '.'

publicHoistPattern:
    - '@inertiajs/core'
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.5.0
    vite-plus: 1.5.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
minimumReleaseAgeExclude:
    - laravel-vite-plugin@3.2.1
